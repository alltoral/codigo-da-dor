<style>
/* Layout: uma coluna de app no celular (max 560px), telas trocadas por etapa, navegador biomecânico como fio condutor. */
:root{
  --carvao:#121212;
  --carvao-2:#1A1A1A;
  --grafite:#262626;
  --linha:#333230;
  --osso:#E0E0E0;
  --texto:#F5F3EF;
  --apoio:#A8A49C;
  --mudo:#77736B;
  --ambar:#D4A017;
  --ambar-claro:#E8BC45;
  --ambar-fundo:rgba(212,160,23,.12);
  --marca:'Cinzel', 'Trajan Pro', Georgia, serif;
  --corpo:'Outfit', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --virada:'Cormorant Garamond', Garamond, Georgia, serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--carvao)}
body{
  color:var(--texto);font-family:var(--corpo);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-color:var(--carvao);
  background-image:
    repeating-linear-gradient(0deg,rgba(212,160,23,.035) 0 1px,transparent 1px 48px),
    repeating-linear-gradient(90deg,rgba(212,160,23,.035) 0 1px,transparent 1px 48px);
  min-height:100%;
}
.app{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:20px 56px;display:flex;flex-direction:column;gap:28px;min-height:100%}
.topo{display:flex;flex-direction:column;gap:14px;border-bottom:1px solid rgba(212,160,23,.35);padding-bottom:12px}
.topo-l1{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.inicio-btn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;margin-right:-8px;background:none;border:1px solid var(--linha);border-radius:22px;color:var(--apoio);font:inherit;font-size:14px;cursor:pointer}
.inicio-btn:hover,.inicio-btn:focus-visible{color:var(--texto);border-color:var(--apoio)}
.etapas{display:flex;flex-direction:column;gap:6px}
.etapas-linha{display:flex;align-items:center}
.etapas-linha i{flex:1;height:1px;background:var(--linha);min-width:4px}
.etapas-linha i.on{background:rgba(212,160,23,.55)}
.etapa{flex:0 0 auto;width:38px;height:44px;margin:0 -3px;padding:0;background:none;border:0;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.etapa span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--marca);font-size:13px;line-height:1;border:1px solid var(--linha);color:var(--mudo);background:var(--carvao)}
.etapa.feito span{border-color:var(--ambar);color:var(--ambar)}
.etapa.feito:hover span{background:var(--ambar-fundo)}
.etapa.atual span{background:var(--ambar);border-color:var(--ambar);color:#141414;font-weight:600;box-shadow:0 0 0 4px rgba(212,160,23,.18)}
.etapa.futura{cursor:default}
.etapa:focus-visible{outline:none}.etapa:focus-visible span{outline:2px solid var(--ambar-claro);outline-offset:2px}
.etapas-info{margin:0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--osso)}
.etapas-info .mudo{color:var(--mudo)}
.topo-marca{display:flex;align-items:center;gap:10px;min-width:0}
.topo-marca img{width:34px;height:34px;object-fit:contain;mix-blend-mode:lighten}
.rotulo{font-family:var(--marca);font-size:11px;letter-spacing:.28em;color:var(--ambar);text-transform:uppercase}
.rotulo.mudo{color:var(--mudo)}
.passos{display:flex;gap:6px;align-items:center}
.passos span{width:8px;height:8px;border-radius:50%;background:var(--linha)}
.passos span.feito{background:var(--ambar)}
.passos span.atual{width:22px;border-radius:4px;background:var(--ambar)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(30px,7.6vw,40px);line-height:1.1}
h2{font-size:clamp(26px,6.4vw,32px);line-height:1.15}
h3{font-size:19px;line-height:1.3}
p{margin:0;max-width:62ch}
.apoio{color:var(--apoio)}
.virada{font-family:var(--virada);font-style:italic;font-weight:600;color:var(--ambar);font-size:1.18em;letter-spacing:0}
.pilha{display:flex;flex-direction:column;gap:14px}
.pilha-l{display:flex;flex-direction:column;gap:22px}
.btn{
  appearance:none;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:17px;
  min-height:54px;padding:14px 22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:var(--ambar);color:#141414;transition:background .15s, transform .1s;text-decoration:none;width:100%;
}
.btn:hover{background:var(--ambar-claro)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.opcao:focus-within,.escolha:focus-visible,.link:focus-visible{outline:2px solid var(--ambar-claro);outline-offset:3px}
.btn.sec{background:transparent;color:var(--texto);border:1px solid var(--linha)}
.btn.sec:hover{border-color:var(--ambar);background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--apoio);font:inherit;font-size:15px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:10px 0;min-height:44px;align-self:flex-start}
.link:hover{color:var(--texto)}
.cartao{background:var(--carvao-2);border:1px solid var(--linha);border-radius:8px;padding:20px}
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.lista li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}

.esp{display:flex;align-items:center;gap:14px}

.esp strong{display:block;font-size:16px}
.esp span{font-size:13px;color:var(--apoio);line-height:1.4;display:block}
.aviso{font-size:13px;color:var(--mudo);line-height:1.5;border-top:1px solid var(--linha);padding-top:16px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-weight:600;font-size:18px;margin-bottom:12px;padding:0}
.escolhas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opcao{position:relative;display:flex}
.opcao input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opcao span{flex:1;display:flex;align-items:center;gap:10px;min-height:52px;padding:12px 14px;border:1px solid var(--linha);border-radius:6px;background:var(--carvao-2);font-size:15px;line-height:1.3;transition:border-color .15s, background .15s}
.opcao span::before{content:"";flex:none;width:14px;height:14px;border-radius:50%;border:1px solid var(--mudo)}
.opcao input[type=checkbox] + span::before{border-radius:3px}
.opcao input:checked + span{border-color:var(--ambar);background:var(--ambar-fundo)}
.opcao input:checked + span::before{background:var(--ambar);border-color:var(--ambar);box-shadow:inset 0 0 0 3px var(--carvao-2)}
.opcao.larga{grid-column:1/-1}
.termo{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--linha);padding-top:18px}
.termo-linha{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;cursor:pointer;padding:8px 0;font-size:14px;line-height:1.5;color:var(--apoio)}
.termo-linha input{appearance:none;-webkit-appearance:none;margin:2px 0 0;width:20px;height:20px;border:1px solid var(--mudo);border-radius:4px;background:transparent;cursor:pointer;display:grid;place-content:center}
.termo-linha input::after{content:"";width:10px;height:6px;border-left:2px solid #141414;border-bottom:2px solid #141414;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.termo-linha input:checked{background:var(--osso);border-color:var(--osso)}
.termo-linha input:checked::after{opacity:1}
.termo-linha input:focus-visible{outline:2px solid var(--ambar-claro);outline-offset:2px}
.termo-linha:hover span{color:var(--osso)}
.teste-cab{display:flex;flex-direction:column;gap:10px}
.figura{background:var(--carvao-2);border:1px solid var(--linha);border-radius:8px;padding:18px 12px;display:flex;justify-content:center}
.figura svg{width:100%;height:auto;max-width:440px}
.figura.video{padding:0;overflow:hidden;background:#141414}
.figura video{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#141414}
.passos-lista{counter-reset:p;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.passos-lista li{counter-increment:p;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.passos-lista li::before{content:counter(p);font-family:var(--marca);color:var(--ambar);border:1px solid rgba(212,160,23,.5);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px}
.criterio{border-left:2px solid var(--ambar);padding:6px 0 6px 16px;display:flex;flex-direction:column;gap:6px}
.resposta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.escolha{appearance:none;cursor:pointer;font:inherit;min-height:64px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;transition:border-color .15s, background .15s}
.escolha strong{font-size:17px;letter-spacing:.1em;text-transform:uppercase}
.escolha small{font-size:12px;opacity:.75}
.escolha.passou{background:var(--ambar);color:#141414;border:1px solid var(--ambar)}
.escolha.reprovou{background:transparent;color:var(--texto);border:1px solid var(--apoio)}
.escolha.reprovou:hover{border-color:var(--texto)}
.escolha.passou:hover{background:var(--ambar-claro)}
.escolha.marcada{box-shadow:0 0 0 2px var(--carvao),0 0 0 4px var(--osso)}
.escolha.reprovou.marcada{border-color:var(--osso);background:rgba(224,224,224,.08)}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:14px;font-weight:500}
.campo input{font:inherit;font-size:17px;min-height:52px;padding:12px 14px;border-radius:6px;border:1px solid var(--linha);background:var(--carvao-2);color:var(--texto)}
.campo input:focus{outline:none;border-color:var(--ambar)}
.campo small{font-size:13px;color:var(--mudo)}
.erro{color:#F2B8A0;font-size:14px}
.mapa{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:stretch}
.nav{display:flex;flex-direction:column;justify-content:space-between;border-left:1px solid rgba(212,160,23,.5);margin-left:8px;padding:2px 0}
.no{display:flex;align-items:center;gap:10px;margin-left:-6px;min-height:30px}
.no i{width:11px;height:11px;border-radius:50%;border:1px solid var(--ambar);background:var(--carvao);flex:none}
.no span{font-family:var(--marca);font-size:11px;letter-spacing:.22em;color:var(--mudo)}
.no.aceso{margin-left:-9px}
.no.aceso i{width:17px;height:17px;background:var(--ambar);box-shadow:0 0 0 5px rgba(212,160,23,.18),0 0 18px rgba(212,160,23,.6)}
.no.aceso span{color:var(--texto)}
.pista{border:1px solid rgba(212,160,23,.5);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(var(--ambar-fundo),transparent 70%)}
.pista.ok{border-color:var(--linha);background:none}
.pista-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.selo{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;letter-spacing:.14em}
.selo.r{border:1px solid var(--apoio);color:var(--osso)}
.selo.p{background:var(--ambar);color:#141414}
.selo.d{border:1px dashed var(--apoio);color:var(--apoio)}
.ex{border-top:1px solid var(--linha);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.ex:first-child{border-top:0;padding-top:0}
.ex-meta{display:flex;flex-wrap:wrap;gap:8px}
.ex-meta span{font-size:13px;border:1px solid var(--linha);border-radius:999px;padding:4px 10px;color:var(--osso)}
.dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dia{position:relative}
.dia input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.dia span{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1/1.15;border:1px solid var(--linha);border-radius:6px;font-size:12px;color:var(--apoio);background:var(--carvao-2);font-variant-numeric:tabular-nums}
.dia span b{font-family:var(--marca);font-size:17px;color:var(--texto);font-weight:500}
.dia input:checked + span{background:var(--ambar);border-color:var(--ambar);color:#141414}

.dia input:focus-visible + span{outline:2px solid var(--ambar-claro);outline-offset:2px}
.oferta{border:1px solid var(--ambar);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:16px;background:var(--carvao-2)}
.preco{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.preco strong{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.copiar{display:flex;gap:8px;align-items:stretch}
.copiar code{flex:1;min-width:0;font-family:var(--corpo);font-size:14px;background:var(--carvao);border:1px solid var(--linha);border-radius:6px;padding:12px;color:var(--osso);overflow-wrap:anywhere}
.copiar button{flex:none;width:auto;min-height:auto;padding:10px 16px;font-size:14px}

.entra{animation:entra .35s ease-out}
@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.entra{animation:none}.btn{transition:none}}

/* Pop-up de segurança: faixa âmbar sólida, impossível confundir com o resto do formulário. */
body.modal-aberto{overflow:hidden}
.modal-fundo{position:fixed;inset:0;z-index:50;background:rgba(8,8,8,.78);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:surge .2s ease-out}

.sinais li svg{color:var(--ambar);margin-top:-1px}
.modal-aviso{margin:0;padding:14px 16px;border-left:3px solid var(--ambar);background:rgba(212,160,23,.06);font-size:15px;line-height:1.5;color:var(--apoio)}
.modal-aviso strong{display:block;color:var(--texto);margin-bottom:4px}
.modal-acoes{display:flex;flex-direction:column;gap:10px}
.btn.alerta-btn{background:transparent;color:var(--ambar-claro);border:1px solid var(--ambar);gap:10px}
.btn.alerta-btn:hover{background:var(--ambar-fundo)}
@keyframes surge{from{opacity:0}to{opacity:1}}
@keyframes sobe{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:600px){.modal-fundo{align-items:center;padding:24px}.modal{border-radius:16px;border-bottom:1px solid rgba(212,160,23,.6);max-height:90vh}}
@media (prefers-reduced-motion:reduce){.modal-fundo,.modal{animation:none}}
@media (max-width:520px){
  .mapa{grid-template-columns:1fr;gap:16px}
  .nav{flex-direction:row;flex-wrap:wrap;justify-content:flex-start;gap:6px;border-left:0;margin-left:0;padding:0}
  .no,.no.aceso{margin-left:0;min-height:32px;padding:4px 11px;border:1px solid var(--linha);border-radius:16px;gap:7px}

}

.credito{display:block;text-align:center;padding:18px 20px calc(24px + env(safe-area-inset-bottom, 0px));font-size:13px;letter-spacing:.04em;color:var(--mudo);text-decoration:none;border-top:1px solid var(--linha);max-width:560px;margin:0 auto}
.credito b{font-family:var(--marca);font-weight:600;letter-spacing:.2em;color:var(--apoio)}
.credito:hover b{color:var(--ambar)}
</style>

<body>

<script>
(function(){
  var SIMBOLO = 'assets/simbolo.png';
  var FOTO = 'assets/douglas.jpg';

  var LINK_DESPERTAR = 'https://corpoprimaz.com.br/';
  var CHAVE = 'codigo-da-dor-v1';

  var estado = carregar() || novo();
  function novo(){ return { tela:'inicio', regiao:'', tempo:'', tentou:[], alertas:[], termo:false, t:{}, nome:'', email:'', whats:'', lgpd:false, dias:[] }; }
  function carregar(){ try{ var s = localStorage.getItem(CHAVE); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
  function salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(estado)); }catch(e){} }
  function ir(tela){ estado.tela = tela; var k = ORDEM.indexOf(tela); if (k > (estado.max||0)) estado.max = k; salvar(); desenhar(); if (tela==='seguranca') return; try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } }

  var app = document.getElementById('app');
  document.addEventListener('keydown', function(e){ if (e.key==='Escape' && estado.tela==='seguranca') ir('triagem'); });

  var ORDEM = ['inicio','triagem','seguranca','orientacao','t1','t2','t3','captura','resultado'];
  var NOMES = {triagem:'Triagem', seguranca:'Segurança', orientacao:'Orientação', t1:'Teste 1', t2:'Teste 2', t3:'Teste 3', captura:'Contato'};
  if (estado.max == null) estado.max = Math.max(0, ORDEM.indexOf(estado.tela));
  var casa = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 8.5L9 3l6.5 5.5M4.5 7v8h3.5v-4.5h2V15h3.5V7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  function etapas(){
    var i = ORDEM.indexOf(estado.tela), total = ORDEM.length-2, out='';
    var max = Math.max(estado.max||0, i);
    if ((estado.alertas && estado.alertas.length) || !estado.termo) max = Math.min(max, 2);

  };

  var LEGENDA_VIDEO = {
    t1:'Animação: deitado na beira da cama, abraçando um joelho; a outra perna pende para fora do colchão e relaxa abaixo da linha do colchão',
    t2:'Animação: de pé com as costas na parede, os braços deslizam de W para Y e voltam, com cotovelos e punhos colados na parede',
    t3:'Animação: em pé sobre os dois pés, braços cruzados no peito, agachamento curto com os dois joelhos alinhados aos pés'
  };
  function videoTeste(id){
    return '<video src="assets/teste-'+id+'.mp4" poster="assets/teste-'+id+'.jpg" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-label="'+LEGENDA_VIDEO[id]+'"></video>';
  }
  function telaTeste(id){
    var t = TESTES[id];
    return topo()+
    '<section class="pilha-l entra">'+
      '<div class="teste-cab"><span class="rotulo">Teste '+t.n+' de 3 · '+t.nome+'</span><h2>'+t.titulo+'</h2><p class="apoio">Avalia: '+t.estrutura+'</p></div>'+
      '<div class="figura video">'+videoTeste(id)+'</div>'+
      '<ol class="passos-lista">'+t.passos.map(function(p){return '<li><span>'+p+'</span></li>';}).join('')+'</ol>'+
      '<div class="pilha">'+
        '<div class="criterio"><span class="rotulo">Passou se</span><p>'+t.passou+'</p></div>'+
        '<div class="criterio" style="border-color:var(--apoio)"><span class="rotulo mudo">Reprovou se</span><p>'+t.reprovou+'</p></div>'+
        '<p class="apoio" style="font-size:14px">Fez dos dois lados? Se qualquer um reprovar, marque reprovou.</p>'+
      '</div>'+
      '<div class="pilha"><span class="rotulo mudo">Seu resultado no Teste '+t.n+'</span>'+
        '<div class="resposta">'+
          '<button class="escolha passou'+(estado.t[id]==='passou'?' marcada':'')+'" data-teste="'+id+'" data-val="passou"><strong>Passou</strong><small>'+(estado.t[id]==='passou'?'sua resposta':'dentro da referência')+'</small></button>'+
          '<button class="escolha reprovou'+(estado.t[id]==='reprovou'?' marcada':'')+'" data-teste="'+id+'" data-val="reprovou"><strong>Reprovou</strong><small>'+(estado.t[id]==='reprovou'?'sua resposta':'achei uma pista')+'</small></button>'+
        '</div>'+
        '<button class="link" data-teste="'+id+'" data-val="dor">Senti dor e parei o teste</button>'+
      '</div>'+
      '<button class="link" data-ir="'+(id==='t1'?'orientacao':(id==='t2'?'t1':'t2'))+'">Voltar</button>'+
    '</section>';
  }
  telas.t1=function(){return telaTeste('t1');};
  telas.t2=function(){return telaTeste('t2');};
  telas.t3=function(){return telaTeste('t3');};

  function reprovados(){ return ['t1','t2','t3'].filter(function(k){ return estado.t[k]==='reprovou'; }); }
  function comDor(){ return ['t1','t2','t3'].filter(function(k){ return estado.t[k]==='dor'; }); }

  telas.captura = function(){
    var r = reprovados().length, d = comDor().length;
    var resumo = r ? (r===1?'1 pista encontrada':r+' pistas encontradas') : (d? 'Testes com dor registrados':'Seu mapa inicial está pronto');
    return topo()+
    '<form class="pilha-l entra" id="f-captura" novalidate>'+
      '<div class="pilha"><span class="rotulo">'+resumo+'</span><h2>Seu Código da Dor está pronto.</h2>'+
      '<p class="apoio">Coloque seu e-mail para liberar o resultado completo, com o padrão provável e os exercícios ligados a cada pista.</p></div>'+
      '<div class="campo"><label for="nome">Seu primeiro nome</label><input id="nome" name="nome" autocomplete="given-name" value="'+esc(estado.nome)+'"></div>'+
      '<div class="campo"><label for="email">Seu melhor e-mail</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Digite seu e-mail aqui" value="'+esc(estado.email)+'" required><small>É por aqui que eu te envio o guia com as fotos de referência.</small></div>'+
      '<div class="campo"><label for="whats">WhatsApp (opcional)</label><input id="whats" name="whats" type="tel" autocomplete="tel" inputmode="tel" placeholder="DDD + número" value="'+esc(estado.whats)+'"><small>Se quiser, te oriento o primeiro passo por lá também.</small></div>'+
      '<div class="termo"><span class="rotulo mudo">Privacidade</span>'+
        '<label class="termo-linha"><input type="checkbox" id="lgpd" name="lgpd"'+(estado.lgpd?' checked':'')+'><span>Aceito receber o resultado e conteúdos do Corpo Primaz. Posso sair quando quiser.</span></label></div>'+
      '<p class="erro" id="erro-cap" hidden></p>'+
      '<button class="btn" type="submit">Liberar meu resultado '+seta+'</button>'+
      '<p class="demo">Versão de demonstração · os dados ficam só neste aparelho</p>'+
      rodape+
    '</form>';
  };

  var NOS = ['Cabeça','Ombros','Mãos','Coluna','Quadris','Joelhos','Pés'];

  telas.resultado = function(){
    var rep = reprovados(), dor = comDor();
    var acesos = {};
    rep.concat(dor).forEach(function(k){ TESTES[k].nos.forEach(function(n){ acesos[n]=true; }); });
    var nav = '<div class="nav" aria-hidden="true">'+NOS.map(function(n,i){return '<div class="no'+(acesos[i]?' aceso':'')+'"><i></i><span>'+n.toUpperCase()+'</span></div>';}).join('')+'</div>';
    var nome = estado.nome ? esc(estado.nome.split(' ')[0])+', ' : '';
    var titulo, texto;
    if (rep.length){
      titulo = nome + (rep.length===1 ? 'você achou uma pista.' : 'você achou '+rep.length+' pistas.');
      texto = 'Cada reprovação mostra um elo da cadeia que não está fazendo o trabalho dele. É por ali que a sobrecarga entra e a dor aparece em outro lugar.';
    } else if (dor.length){
      titulo = nome+'seu corpo pediu uma pausa.';
      texto = 'Você sentiu dor durante '+(dor.length===1?'um teste':'alguns testes')+'. Isso é informação: o corpo está em modo proteção. Comece pelo destrave geral e refaça com calma em alguns dias.';
    } else {
      titulo = nome+'os 3 testes passaram.';
      texto = 'Ótimo sinal para quadril, parte de cima e glúteo. Se a dor continua voltando, a sobrecarga pode estar entrando por outro elo: pés, tornozelos, cervical ou respiração. É isso que o mapa completo investiga.';
    }
    var pistas = ['t1','t2','t3'].map(function(k,i){
      var t = TESTES[k], v = estado.t[k];
      var selo = v==='reprovou' ? '<span class="selo r">REPROVOU</span>' : (v==='dor' ? '<span class="selo d">PAROU POR DOR</span>' : '<span class="selo p">PASSOU</span>');
      if (v==='reprovou') return '<article class="pista"><div class="pista-topo"><span class="rotulo">Pista 0'+(i+1)+' · Teste '+t.n+'</span>'+selo+'</div><h3>'+t.pista+'</h3><p class="apoio" style="font-size:15px">'+t.porque+'</p></article>';
      return '<article class="pista ok"><div class="pista-topo"><span class="rotulo mudo">Teste '+t.n+' · '+t.nome+'</span>'+selo+'</div><p class="apoio" style="font-size:15px">'+(v==='dor'?'Pare este movimento por enquanto. Refaça depois de alguns dias de destrave.':t.passou)+'</p></article>';
    }).join('');
    var exs = rep.map(function(k){ return TESTES[k].ex; }).concat(['e4']);
    var exHtml = exs.map(function(id){ var e = EXERCICIOS[id];
      return '<div class="ex"><span class="rotulo mudo">'+e.liga+'</span><h3>'+e.nome+'</h3><p style="font-size:15px">'+e.como+'</p><div class="ex-meta">'+e.dose.map(function(d){return '<span>'+d+'</span>';}).join('')+'</div><p class="apoio" style="font-size:14px">'+e.observar+'</p></div>';
    }).join('');
    var dias=''; for (var d=1; d<=7; d++){ dias += '<label class="dia"><input type="checkbox" data-dia="'+d+'"'+(estado.dias.indexOf(d)>-1?' checked':'')+' aria-label="Dia '+d+' feito"><span><b>'+d+'</b>dia</span></label>'; }
    var feitos = estado.dias.length;
    var pistaTxt = rep.length ? rep.map(function(k){return 'Teste '+TESTES[k].n+' reprovou';}).join(', ') : (dor.length?'senti dor nos testes':'passei nos 3 testes');
    var msg = 'MAPA + meu resultado: '+pistaTxt+'. Dor: '+(estado.regiao||'não informei')+(estado.tempo?' há '+estado.tempo.toLowerCase():'')+'.';
    return topo()+
    '<section class="pilha-l entra">'+
      '<div class="pilha"><span class="rotulo">Seu Código da Dor</span><h2>'+titulo+'</h2><p class="apoio">'+texto+'</p></div>'+
      '<div class="cartao"><div class="mapa">'+nav+'<div class="pilha">'+pistas+'</div></div></div>'+
      '<div class="pilha"><span class="rotulo">Seu primeiro passo · 5 a 7 dias</span><h2>O que fazer com '+(rep.length>1?'essas pistas':(rep.length?'essa pista':'isso'))+'.</h2>'+
      '<p class="apoio">Cada exercício está amarrado a um teste. Sem achismo, com critério. Uma vez por dia, sem dor, sem pressa.</p></div>'+
      '<div class="cartao pilha-l">'+exHtml+'</div>'+
      '<div class="cartao pilha"><div class="pista-topo"><h3>Marque os dias feitos</h3><span class="apoio" style="font-size:14px;font-variant-numeric:tabular-nums">'+feitos+' de 7</span></div>'+
        '<div class="dias">'+dias+'</div>'+
        '<p class="apoio" style="font-size:14px">No 7º dia, refaça os testes e compare. A perna desceu mais? O cotovelo chegou mais perto da parede?</p>'+
        '<button class="btn sec" data-refazer="1">Refazer os testes</button></div>'+
      '<div class="oferta" id="despertar">'+
        '<span class="rotulo">Próximo passo · Raio-X Biomecânico</span>'+
        '<h2>3 testes mostram a pista. <span class="virada">O mapa completo mostra o caminho.</span></h2>'+
        '<p class="apoio">O Raio-X Biomecânico é o método completo: todas as avaliações e todos os exercícios de correção, na ordem certa, checkpoint por checkpoint, com todas as camadas de suporte.</p>'+
        '<ul class="lista">'+
          '<li>'+check+'<span>Os 12 checkpoints com teste, gabarito e protocolo de correção</span></li>'+
          '<li>'+check+'<span>Você só avança quando passa, com quiz de validação</span></li>'+
          '<li>'+check+'<span>Protocolo de crise de 15 minutos para quando travar</span></li>'+
          '<li>'+check+'<span>15 minutos por dia, em casa, acesso por 12 meses</span></li>'+
          '<li>'+check+'<span>Camadas de suporte e 4 auditorias individuais em vídeo</span></li>'+
        '</ul>'+
        '<a class="btn" href="'+LINK_DESPERTAR+'">Quero o método completo '+seta+'</a>'+
        '<p class="apoio" style="font-size:13px">42 dias é o marco de referência do método para reeducar o padrão motor e desarmar o modo de proteção. Não é promessa de prazo.</p>'+
      '</div>'+
      '<div class="cartao pilha">'+especialista+
        '<p style="font-size:15px">Prefere conversar antes? Me manda seu resultado no direct que eu te digo por onde começar.</p>'+
        '<div class="copiar"><code id="msg">'+esc(msg)+'</code><button class="btn sec" id="copiar" type="button">Copiar</button></div>'+
        '<a class="btn sec" href="'+INSTAGRAM+'" target="_blank" rel="noopener">Abrir o @corpoprimaz</a></div>'+
      rodape+
      '<button class="link" data-zerar="1">Começar do zero</button>'+
    '</section>';
  };

  function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function desenhar(){
    var f = telas[estado.tela] || telas.inicio;
    app.innerHTML = f();
    document.body.classList.toggle('modal-aberto', estado.tela==='seguranca');
    var reduzir = false; try{ reduzir = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    app.querySelectorAll('video').forEach(function(v){
      v.muted = true; v.defaultMuted = true; v.setAttribute('muted','');
      if (reduzir){ v.pause(); v.removeAttribute('autoplay'); v.controls = true; return; }
      var p = v.play(); if (p && p.catch) p.catch(function(){ v.controls = true; });
    });
    if (reduzir) app.querySelectorAll('svg').forEach(function(sv){ if(sv.pauseAnimations) sv.pauseAnimations(); });
    ligar();
  }

  function ligar(){
    app.querySelectorAll('[data-ir]').forEach(function(b){ b.addEventListener('click', function(e){ e.preventDefault(); ir(b.getAttribute('data-ir')); }); });
    app.querySelectorAll('[data-teste]').forEach(function(b){ b.addEventListener('click', function(){
      var id=b.getAttribute('data-teste'); estado.t[id]=b.getAttribute('data-val');
      ir(id==='t1'?'t2':(id==='t2'?'t3':(estado.email?'resultado':'captura')));
    }); });
    var ft = document.getElementById('f-triagem');
    if (ft) ft.addEventListener('submit', function(e){ e.preventDefault();
      var fd = new FormData(ft); estado.regiao = fd.get('regiao')||''; estado.tempo = fd.get('tempo')||''; estado.tentou = fd.getAll('tentou');
      if(!estado.regiao || !estado.tempo){ document.getElementById('erro-triagem').hidden=false; salvar(); return; }
      ir('seguranca'); });
    var sn = document.getElementById('seg-nao');
    if (sn){
      var ttl = document.getElementById('seg-titulo'); if (ttl) ttl.focus({preventScroll:true});
      sn.addEventListener('click', function(){
        var tm = document.getElementById('termo'); estado.termo = !!(tm && tm.checked);
        if(!estado.termo){ var er=document.getElementById('erro-seg'); er.hidden=false; salvar(); tm.focus(); return; }
        estado.alertas = []; ir('orientacao'); });
      document.getElementById('seg-sim').addEventListener('click', function(){
        var tm = document.getElementById('termo'); estado.termo = !!(tm && tm.checked);
        estado.alertas = ['sim']; ir('alerta'); });
      var tm0 = document.getElementById('termo'); if (tm0) tm0.addEventListener('change', function(){ estado.termo = tm0.checked; if (tm0.checked) document.getElementById('erro-seg').hidden = true; salvar(); });
      var mf = app.querySelector('[data-fechar]'); if (mf) mf.addEventListener('click', function(e){ if (e.target===mf) ir('triagem'); });
    }
    var fc = document.getElementById('f-captura');
    if (fc) fc.addEventListener('submit', function(e){ e.preventDefault();
      var fd = new FormData(fc); var em = String(fd.get('email')||'').trim(); var er = document.getElementById('erro-cap');
      estado.nome = String(fd.get('nome')||'').trim(); estado.whats = String(fd.get('whats')||'').trim(); estado.lgpd = !!fd.get('lgpd');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ er.textContent='Confira o e-mail. Ele precisa ter @ e um domínio, como nome@email.com.'; er.hidden=false; salvar(); return; }
      if(!estado.lgpd){ er.textContent='Marque a caixa de consentimento para receber o resultado.'; er.hidden=false; salvar(); return; }
      estado.email = em; ir('resultado'); });
    app.querySelectorAll('[data-dia]').forEach(function(c){ c.addEventListener('change', function(){
      var d = +c.getAttribute('data-dia'); var i = estado.dias.indexOf(d);
      if (c.checked && i<0) estado.dias.push(d); if(!c.checked && i>-1) estado.dias.splice(i,1);
      salvar(); desenhar(); var el = app.querySelector('[data-dia="'+d+'"]'); if(el) el.focus(); }); });
    var rf = app.querySelector('[data-refazer]'); if (rf) rf.addEventListener('click', function(){ estado.t = {}; ir('t1'); });
    var zr = app.querySelector('[data-zerar]'); if (zr) zr.addEventListener('click', function(){ estado = novo(); ir('inicio'); });
    var cp = document.getElementById('copiar');
    if (cp) cp.addEventListener('click', function(){
      var txt = document.getElementById('msg').textContent;
      function ok(){ cp.textContent='Copiado'; setTimeout(function(){ cp.textContent='Copiar'; },1800); }
      function selecionar(){ var r=document.createRange(); r.selectNodeContents(document.getElementById('msg')); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); cp.textContent='Selecionado'; }
      try{ navigator.clipboard.writeText(txt).then(ok, selecionar); }catch(e){ selecionar(); }
    });
  }

  desenhar();
})();
</script>
</body>
</html>
